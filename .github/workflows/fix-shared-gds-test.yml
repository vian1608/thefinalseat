name: Patch shared GDS reliability assertion
on:
  push:
    paths:
      - '.github/workflows/fix-shared-gds-test.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/tests/admin_dashboard_button_reliability.test.mjs')
          s = p.read_text()
          old = "expectRegex(sharedGdsImporter, /try\\s*{[\\s\\S]*?handleParseAndPreview[\\s\\S]*?setErrorMsg/, 'Shared importer must surface parsing errors');"
          new = "expectRegex(sharedGdsImporter, /handleParseAndPreview[\\s\\S]*?catch\\s*\\(err\\)[\\s\\S]*?setErrorMsg/, 'Shared importer must surface parsing errors');"
          if old not in s:
              raise SystemExit('target assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-shared-gds-test.yml
          git add backend/tests/admin_dashboard_button_reliability.test.mjs
          git commit -m "test: fix shared GDS parse-error assertion"
          git push
