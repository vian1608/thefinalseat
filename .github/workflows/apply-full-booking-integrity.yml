name: Apply Full Booking Integrity Hardening

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-full-booking-integrity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply booking integrity patch
        run: python3 scripts/patch-booking-integrity-full.py

      - name: Commit changes and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-full-booking-integrity.yml scripts/patch-booking-integrity-full.py
          git add backend/src/modules/bookings/booking.repository.mjs \
                  backend/src/modules/bookings/booking.service.mjs \
                  backend/src/modules/bookings/booking.mapper.mjs \
                  backend/src/modules/travellers/traveller.service.mjs \
                  frontend/src/features/bookings/pages/BookingPage.js
          git commit -m "fix: make booking creation database-authoritative end to end"
          git push origin HEAD:master
