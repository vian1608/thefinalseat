name: Apply Production Booking Runtime Cleanup

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-production-booking-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Prepare cleanup helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch-production-booking-runtime.py')
          text = path.read_text()
          start = text.index('# Collapse rollback/delete into one FK-cascade booking delete plus non-FK audit cleanup.')
          end = text.index('# Pricing writes are not successful unless the DB update succeeds.', start)
          text = text[:start] + '# Rollback simplification is handled separately after the runtime cleanup.\n' + text[end:]
          path.write_text(text)
          PY

      - name: Apply production booking cleanup
        run: python3 scripts/patch-production-booking-runtime.py

      - name: Commit cleanup and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-production-booking-runtime.yml scripts/patch-production-booking-runtime.py
          git add backend/src/modules/bookings/booking.repository.mjs \
                  backend/src/modules/bookings/booking.service.mjs \
                  backend/src/modules/authorizations/passenger-authorization.service.mjs
          git commit -m "fix: close remaining booking persistence and admin runtime gaps"
          git push origin HEAD:master
