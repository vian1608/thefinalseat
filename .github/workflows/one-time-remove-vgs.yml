name: One-time VGS removal and checkout repair

on:
  push:
    paths:
      - '.github/workflows/one-time-remove-vgs.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Replace VGS checkout with safe internal card reference flow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace(path, old, new, count=None):
              p = root / path
              text = p.read_text()
              actual = text.count(old)
              expected = 1 if count is None else count
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old, new, expected))

          # Checkout: swap the embedded VGS iframe fields for an internal, non-sensitive
          # card reference component. Full PAN/CVV are deliberately not collected/stored.
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "import VgsCheckoutCardFields from '../../secure-payments/VgsCheckoutCardFields';",
              "import InternalCardReferenceFields from '../../payments/components/InternalCardReferenceFields';"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "  // Only non-sensitive payment metadata lives in React state. PAN / expiry / CVV stay inside VGS Collect fields.",
              "  // Only non-sensitive payment reference metadata lives in React state/database. Full PAN and CVV are never collected or stored."
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "    const cardBrand = String(maskedCard.cardBrand || '').trim() || null;",
              "    const cardBrand = String(maskedCard.cardBrand || '').trim() || null;\n    const cardExpDate = String(maskedCard.cardExpDate || '').trim() || null;"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "      cardBrand,\n      billingPhone: cardForm.billingPhone,",
              "      cardBrand,\n      cardExpDate,\n      billingPhone: cardForm.billingPhone,"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "      payment_provider: 'VGS',",
              "      payment_provider: 'INTERNAL_REFERENCE',"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "    if (!secureCardRef.current?.isReady()) {\n      setCardError('Secure card fields are still loading. Please wait a moment and try again.');\n      return;\n    }\n\n    if (!secureCardRef.current?.isValid()) {\n      setCardError('Please enter a valid card number, expiration date, and security code.');\n      return;\n    }",
              "    if (!secureCardRef.current?.isReady()) {\n      setCardError('Payment details are still loading. Please wait a moment and try again.');\n      return;\n    }\n\n    if (!secureCardRef.current?.isValid()) {\n      const validationMessage = secureCardRef.current?.getValidationMessage?.() || 'Please enter a valid card brand, last four digits, and expiration date.';\n      setCardError(validationMessage);\n      window.setTimeout(() => document.querySelector('.payment-error-banner')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 60);\n      return;\n    }"
          )

          old_processing = """      // 1. Create the reservation using only safe card metadata. Raw card values never enter this payload.
      const maskedCard = secureCardRef.current.getMaskedMetadata();
      const pending = await createPendingBookingRecord(maskedCard);
      const bCode = pending.code;

      // 2. Tokenize the same card fields already entered on this checkout and attach them to this booking.
      //    PAN/expiry are persistent VGS aliases; CVV is a volatile VGS alias.
      await secureCardRef.current.secureBooking({
        bookingId: pending.id,
        bookingCode: bCode,
        customerEmail: primaryContact.email,
        customerName: `${primaryContact.firstName} ${primaryContact.lastName}`.trim(),
        customerPhone: primaryContact.phone,
        authorizedAmount: Number(calculateTotal().total),
        currency: 'USD',
        purpose: `Flight booking ${bCode}`,
        idempotencyKey: idempotencyKeyRef.current,
        cardholderName: cardForm.cardholderName,
        billingAddress: {
          line1: cardForm.billingAddress,
          line2: cardForm.billingAddress2 || '',
          city: cardForm.billingCity,
          region: cardForm.billingState,
          postalCode: cardForm.billingZip,
          country: cardForm.billingCountry,
        },
      });

      // 3. Only complete checkout after the booking and its secure payment authorization are linked.
"""
          new_processing = """      // Create the reservation with safe card-reference metadata only.
      // A bounded timeout guarantees the customer is never left with a silent, endless click.
      const safeCardReference = secureCardRef.current.getMaskedMetadata();
      const pending = await Promise.race([
        createPendingBookingRecord(safeCardReference),
        new Promise((_, reject) => window.setTimeout(() => {
          const timeoutError = new Error('The reservation request took too long. Please check your email or My Bookings before retrying.');
          timeoutError.code = 'CHECKOUT_TIMEOUT';
          reject(timeoutError);
        }, 25000)),
      ]);
      const bCode = pending.code;

      // Only complete checkout after the reservation has been saved successfully.
"""
          replace('frontend/src/features/bookings/pages/BookingPage.js', old_processing, new_processing)

          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "      console.error('Secure booking processing error:', err);",
              "      console.error('Reservation processing error:', err);"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "        setCardError(err?.message || `We couldn't securely save your payment authorization. Reference ID: ${referenceId}`);",
              "        setCardError(err?.message || `We couldn't save your reservation details. Reference ID: ${referenceId}`);"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "          `We couldn't securely process your reservation. Please review your details and try again. ` +",
              "          `We couldn't process your reservation. Please review your details and try again. ` +"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "              {/* SECTION 4: UNIFIED SECURE CREDIT / DEBIT CARD PAYMENT */}",
              "              {/* SECTION 4: PAYMENT REFERENCE & BILLING DETAILS */}"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "                title=\"4. Secure Credit / Debit Card Payment\"",
              "                title=\"4. Payment Reference & Billing Details\""
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "                      <span className=\"secure-badge\"><i className=\"fas fa-lock\"></i> Encrypted Checkout</span>\n                      <span className=\"secure-badge\"><i className=\"fas fa-shield-alt\"></i> Card Fields Secured by VGS</span>",
              "                      <span className=\"secure-badge\"><i className=\"fas fa-lock\"></i> Protected Reservation</span>\n                      <span className=\"secure-badge\"><i className=\"fas fa-shield-alt\"></i> No Full Card / CVV Storage</span>"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "                      <i className=\"fas fa-credit-card\"></i> Card Details",
              "                      <i className=\"fas fa-credit-card\"></i> Card Reference"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "                        onChange={(e) => setCardForm({ ...cardForm, cardholderName: e.target.value })}",
              "                        onChange={(e) => { setCardForm({ ...cardForm, cardholderName: e.target.value }); setFieldErrors(prev => ({ ...prev, cardholderName: null })); if (cardError) setCardError(''); }}"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "                    <VgsCheckoutCardFields ref={secureCardRef} onFocus={handlePaymentFocus} />",
              "                    <InternalCardReferenceFields ref={secureCardRef} onFocus={handlePaymentFocus} onChange={() => setCardError('')} />"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "                      Card number, expiration date, and security code are entered directly into protected VGS fields. The Final Seat receives vault references and masked metadata, not the raw values.",
              "                      For safety, only the card brand, last four digits, and expiration date are saved with this reservation. Full card numbers and security codes are not collected or stored."
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "                    disabled={cardProcessing || !termsAccepted}",
              "                    disabled={cardProcessing}"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "                      <span><i className=\"fas fa-circle-notch fa-spin\"></i> Securing Card & Creating Reservation...</span>",
              "                      <span><i className=\"fas fa-circle-notch fa-spin\"></i> Creating Reservation...</span>"
          )
          replace(
              'frontend/src/features/bookings/pages/BookingPage.js',
              "                      <span><i className=\"fas fa-lock\"></i> Complete Secure Booking — ${pricing.total} USD</span>",
              "                      <span><i className=\"fas fa-lock\"></i> Submit Reservation — ${pricing.total} USD</span>"
          )

          component = r'''import React, { forwardRef, useImperativeHandle, useMemo, useState } from 'react';

const CARD_BRANDS = ['Visa', 'Mastercard', 'American Express', 'Discover', 'Other'];

function validateExpiry(value) {
  if (!/^\d{4}-\d{2}$/.test(String(value || ''))) {
    return { valid: false, message: 'Please enter the card expiration month and year.' };
  }
  const [yearText, monthText] = value.split('-');
  const year = Number(yearText);
  const month = Number(monthText);
  if (!Number.isInteger(year) || !Number.isInteger(month) || month < 1 || month > 12) {
    return { valid: false, message: 'Please enter a valid expiration date.' };
  }
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth() + 1;
  if (year < currentYear || (year === currentYear && month < currentMonth)) {
    return { valid: false, message: 'This card expiration date has already passed. Please enter a current card.' };
  }
  return { valid: true, month, year };
}

const InternalCardReferenceFields = forwardRef(function InternalCardReferenceFields({ onFocus, onChange }, ref) {
  const [cardBrand, setCardBrand] = useState('');
  const [last4, setLast4] = useState('');
  const [expiry, setExpiry] = useState('');

  const validation = useMemo(() => {
    if (!cardBrand) return { valid: false, message: 'Please select the card brand.' };
    if (!/^\d{4}$/.test(last4)) return { valid: false, message: 'Please enter exactly the last four digits of the card.' };
    return validateExpiry(expiry);
  }, [cardBrand, last4, expiry]);

  const notifyChange = () => {
    if (typeof onChange === 'function') onChange();
  };

  useImperativeHandle(ref, () => ({
    isReady: () => true,
    isValid: () => validation.valid,
    getValidationMessage: () => validation.message || '',
    getMaskedMetadata: () => {
      const expiryCheck = validateExpiry(expiry);
      return {
        cardBrand: cardBrand || null,
        last4: /^\d{4}$/.test(last4) ? last4 : null,
        cardExpDate: expiryCheck.valid
          ? `${String(expiryCheck.month).padStart(2, '0')}/${expiryCheck.year}`
          : null,
      };
    },
    clearSensitive: () => {},
  }), [cardBrand, last4, expiry, validation]);

  return (
    <div className="internal-card-reference-fields" onFocus={onFocus}>
      <div className="form-row-three" style={{ marginTop: '0.85rem' }}>
        <div className="booking-form-field">
          <label htmlFor="cardBrand">Card Brand <span style={{ color: '#dc2626' }}>*</span></label>
          <select
            id="cardBrand"
            value={cardBrand}
            onChange={(event) => { setCardBrand(event.target.value); notifyChange(); }}
            required
          >
            <option value="">Select brand</option>
            {CARD_BRANDS.map((brand) => <option key={brand} value={brand}>{brand}</option>)}
          </select>
        </div>

        <div className="booking-form-field">
          <label htmlFor="cardLast4">Last 4 Digits <span style={{ color: '#dc2626' }}>*</span></label>
          <input
            id="cardLast4"
            type="text"
            inputMode="numeric"
            autoComplete="off"
            maxLength={4}
            placeholder="1234"
            value={last4}
            onChange={(event) => { setLast4(event.target.value.replace(/\D/g, '').slice(0, 4)); notifyChange(); }}
            required
          />
        </div>

        <div className="booking-form-field">
          <label htmlFor="cardExpiry">Expiration Date <span style={{ color: '#dc2626' }}>*</span></label>
          <input
            id="cardExpiry"
            type="month"
            value={expiry}
            onChange={(event) => { setExpiry(event.target.value); notifyChange(); }}
            required
          />
        </div>
      </div>

      {!validation.valid && (cardBrand || last4 || expiry) && (
        <p style={{ margin: '0.65rem 0 0', fontSize: '0.82rem', color: '#b91c1c' }} role="status">
          {validation.message}
        </p>
      )}
    </div>
  );
});

export default InternalCardReferenceFields;
'''
          component_path = root / 'frontend/src/features/payments/components/InternalCardReferenceFields.js'
          component_path.parent.mkdir(parents=True, exist_ok=True)
          component_path.write_text(component)

          # Remove VGS public route from backend.
          replace(
              'backend/src/routes/index.mjs',
              "import { securePaymentPublicRouter } from '../modules/secure-payments/secure-payment.routes.mjs';\n",
              ''
          )
          replace(
              'backend/src/routes/index.mjs',
              "const securePaymentRateLimiter = rateLimit({ windowMs: 60000, maxRequests: 30, message: 'Too many secure payment requests. Please wait a minute.' });\n",
              ''
          )
          replace(
              'backend/src/routes/index.mjs',
              "router.use('/secure-payments', noStore, securePaymentRateLimiter, securePaymentPublicRouter);\n",
              ''
          )

          # Remove VGS authorization tooling from back office.
          replace(
              'backend/src/modules/backoffice/backoffice.routes.mjs',
              "import { securePaymentAdminRouter } from './secure-payment-admin.routes.mjs';\n",
              ''
          )
          replace(
              'backend/src/modules/backoffice/backoffice.routes.mjs',
              "router.use('/', securePaymentAdminRouter);\n",
              ''
          )

          # Remove public VGS payment page routing.
          replace(
              'frontend/src/index.js',
              "import { BrowserRouter, Route, Routes } from 'react-router-dom';",
              "import { BrowserRouter } from 'react-router-dom';"
          )
          replace(
              'frontend/src/index.js',
              "import SecurePaymentPage from './features/secure-payments/SecurePaymentPage';\n",
              ''
          )
          replace(
              'frontend/src/index.js',
              "// Preserve every established App.js route. Only additive back-office and secure-payment\n// URLs are intercepted here so the stable flight/admin route table does not need a rewrite.\n",
              "// Preserve every established App.js route. Only additive back-office URLs are intercepted here.\n"
          )
          replace(
              'frontend/src/index.js',
              "const isSecurePaymentPath = /^\\/secure-payment\\/[^/]+\\/?$/.test(window.location.pathname);\n",
              ''
          )
          replace(
              'frontend/src/index.js',
              "      ) : isSecurePaymentPath ? (\n        <BrowserRouter><Routes><Route path=\"/secure-payment/:token\" element={<SecurePaymentPage />} /></Routes></BrowserRouter>\n      ) : <App />}",
              "      ) : <App />}"
          )

          # Remove VGS-specific back-office pages/navigation.
          replace(
              'frontend/src/features/backoffice/BackOfficeRouter.js',
              "import { PaymentAuthorizationDetailPage, PaymentAuthorizationsPage } from './SecurePaymentAdminPages';\nimport PaymentFlowTestPage from './PaymentFlowTestPage';\nimport './SecurePaymentAdmin.css';\n",
              ''
          )
          replace(
              'frontend/src/features/backoffice/BackOfficeRouter.js',
              "    <Route path=\"/admin/payments/authorizations\" element={<Page permission=\"authorization.view\"><PaymentAuthorizationsPage /></Page>} />\n    <Route path=\"/admin/payments/authorizations/:id\" element={<Page permission=\"authorization.view\"><PaymentAuthorizationDetailPage /></Page>} />\n",
              ''
          )
          replace(
              'frontend/src/features/backoffice/BackOfficeRouter.js',
              "    <Route path=\"/admin/testing/payment-flow\" element={<Page permission=\"admin.settings\"><PaymentFlowTestPage /></Page>} />\n",
              ''
          )
          replace(
              'frontend/src/features/backoffice/BackOfficeShell.js',
              "  ['Authorizations','/admin/payments/authorizations','authorization.view'],\n  ['Payment Test','/admin/testing/payment-flow','admin.settings'],\n",
              ''
          )

          # Remove VGS panel from the legacy booking admin detail route.
          replace(
              'frontend/src/features/admin/pages/AdminDashboardPage.js',
              "import AdminSecurePaymentPanel from '../components/AdminSecurePaymentPanel';\n",
              ''
          )
          replace(
              'frontend/src/features/admin/pages/AdminDashboardPage.js',
              "          <AdminSecurePaymentPanel />\n",
              ''
          )

          # Remove VGS environment configuration from the checked-in example.
          env_path = root / 'backend/.env.example'
          env_text = env_path.read_text()
          marker_start = '# ─── VGS Secure Payment Vault'
          marker_end = '# ─── Admin'
          start = env_text.find(marker_start)
          end = env_text.find(marker_end)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('backend/.env.example: VGS block markers not found')
          env_path.write_text(env_text[:start] + env_text[end:])

          # Delete active VGS/secure-card modules after all imports are removed.
          delete_paths = [
              'backend/src/modules/secure-payments/vgs-vault.service.mjs',
              'backend/src/modules/secure-payments/secure-payment.routes.mjs',
              'backend/src/modules/secure-payments/secure-payment-email.service.mjs',
              'backend/src/modules/backoffice/secure-payment-admin.routes.mjs',
              'frontend/src/features/secure-payments/SecurePaymentPage.js',
              'frontend/src/features/secure-payments/SecurePaymentPage.css',
              'frontend/src/features/secure-payments/VgsCheckoutCardFields.js',
              'frontend/src/features/backoffice/SecurePaymentAdminPages.js',
              'frontend/src/features/backoffice/SecurePaymentAdmin.css',
              'frontend/src/features/backoffice/PaymentFlowTestPage.js',
              'frontend/src/features/admin/components/AdminSecurePaymentPanel.js',
          ]
          for rel in delete_paths:
              p = root / rel
              if not p.exists():
                  raise SystemExit(f'Expected VGS file is missing: {rel}')
              p.unlink()

          # Active application source must contain no VGS provider references after this change.
          forbidden = ('VGS', 'verygoodsecurity', 'verygoodvault')
          leftovers = []
          scan_roots = [root / 'frontend/src', root / 'backend/src', root / 'backend/.env.example']
          for scan_root in scan_roots:
              paths = [scan_root] if scan_root.is_file() else [p for p in scan_root.rglob('*') if p.is_file()]
              for p in paths:
                  try:
                      text = p.read_text()
                  except UnicodeDecodeError:
                      continue
                  for token in forbidden:
                      if token.lower() in text.lower():
                          leftovers.append(f'{p}: contains {token}')
                          break
          if leftovers:
              raise SystemExit('Active VGS references remain:\n' + '\n'.join(leftovers[:80]))
          PY

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Commit repaired checkout
        shell: bash
        run: |
          rm -f .github/workflows/one-time-remove-vgs.yml
          git config user.name "The Final Seat Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove VGS and repair checkout validation"
          git push origin master
