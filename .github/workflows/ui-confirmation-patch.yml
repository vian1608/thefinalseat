name: Apply confirmation UI patch

on:
  push:
    paths:
      - '.github/workflows/ui-confirmation-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/ui_confirmation_patch.py
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/ui_confirmation_patch.py .github/workflows/ui-confirmation-patch.yml
          git add frontend/src/features/bookings/pages/PaymentSuccessPage.js
          git commit -m "fix: repair confirmation airline logos"
          git push
