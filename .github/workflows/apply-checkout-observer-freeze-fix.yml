name: Apply Checkout Observer Freeze Fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-checkout-observer-freeze-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply checkout observer fix
        run: python3 scripts/fix-checkout-dom-observer-loop.py

      - name: Commit fix and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-checkout-observer-freeze-fix.yml scripts/fix-checkout-dom-observer-loop.py
          git add frontend/src/features/bookings/vouchers/BookingVoucherPage.js backend/tests/voucher_system_contract.test.mjs
          git commit -m "fix: stop checkout mutation observer feedback loop"
          git push origin HEAD:master
