name: Production Smoke

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: production-smoke-${{ github.repository }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify live production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact Vercel production deployment
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          vercel_state="missing"
          for attempt in $(seq 1 40); do
            payload="$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")"
            vercel_state="$(printf '%s' "$payload" | jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')"
            echo "Vercel status: ${vercel_state} (attempt ${attempt}/40)"
            if [[ "$vercel_state" == "success" ]]; then
              break
            fi
            if [[ "$vercel_state" == "failure" || "$vercel_state" == "error" ]]; then
              echo "Vercel deployment failed for ${GITHUB_SHA}." >&2
              exit 1
            fi
            sleep 15
          done
          if [[ "$vercel_state" != "success" ]]; then
            echo "Timed out waiting for Vercel deployment status for ${GITHUB_SHA}." >&2
            exit 1
          fi

      - name: Smoke public production routes
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://www.thefinalseat.com/"
            "https://www.thefinalseat.com/hotels"
            "https://www.thefinalseat.com/car-rentals"
            "https://www.thefinalseat.com/my-bookings"
            "https://www.thefinalseat.com/contact"
            "https://www.thefinalseat.com/terms"
            "https://www.thefinalseat.com/privacy-policy"
            "https://www.thefinalseat.com/refund-policy"
            "https://www.thefinalseat.com/admin/login"
            "https://www.thefinalseat.com/api/health"
            "https://www.thefinalseat.com/robots.txt"
            "https://www.thefinalseat.com/sitemap.xml"
          )
          for url in "${urls[@]}"; do
            echo "Checking ${url}"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-all-errors \
              --max-time 30 "$url" >/dev/null
          done

      - name: Verify production identity
        shell: bash
        run: |
          set -euo pipefail
          home="$(curl --fail --silent --show-error --location --max-time 30 https://www.thefinalseat.com/)"
          if ! printf '%s' "$home" | grep -qi 'The Final Seat'; then
            echo "The live homepage does not contain the expected The Final Seat identity." >&2
            exit 1
          fi

      - name: Verify canonical domain redirect
        shell: bash
        run: |
          set -euo pipefail
          target="$(curl --silent --show-error --head --location-trusted --max-redirs 0 \
            -o /dev/null -w '%{redirect_url}' https://thefinalseat.com/ || true)"
          if [[ "$target" != https://www.thefinalseat.com/* ]]; then
            echo "Expected thefinalseat.com to redirect to www.thefinalseat.com, got: ${target:-no redirect}" >&2
            exit 1
          fi
          echo "Canonical redirect verified: ${target}"
