name: Apply Airport Swap Control

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-airport-swap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply swap patch
        run: python3 tools/apply_airport_swap.py

      - name: Commit changes and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-airport-swap.yml tools/apply_airport_swap.py
          git add frontend/src/features/flights/pages/Home.js frontend/src/features/flights/pages/Home.css
          git commit -m "feat: add origin destination swap controls"
          git push origin HEAD:master
