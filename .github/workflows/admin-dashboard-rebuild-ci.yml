name: Admin Dashboard Rebuild CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [fix/admin-dashboard-rebuild-20260808]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        # The checked-in frontend lockfile predates peer dependencies now
        # required by react-scripts. npm install verifies the real dependency
        # graph without making this reliability PR rewrite a 600KB lockfile.
        run: npm install --no-audit --no-fund
      - name: Test GDS importer normalization
        working-directory: frontend
        env:
          CI: "true"
        run: npm test -- --watchAll=false gdsImportNormalizer.test.js
      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Run backend tests
        working-directory: backend
        run: npm test
