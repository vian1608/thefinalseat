name: One-time Egress UI Hardening

on:
  push:
    branches: [master]
    paths:
      - scripts/apply-egress-ui-hardening.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic frontend patch
        run: node scripts/apply-egress-ui-hardening.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/admin/pages/AdminDashboardPageV2.js
          git commit -m "perf(admin): lazy-load incomplete checkouts and canonicalize done status"
          git push origin HEAD:master
